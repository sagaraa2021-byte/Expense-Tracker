<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pencatat Pengeluaran</title>
<style>
  :root{
    --bg:#FAFAF8; --card:#fff; --line:#E4E1DA; --ink:#22221F; --sub:#7A7770;
    --green:#3F7D57; --red:#B4402A;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#191917; --card:#232320; --line:#37372F; --ink:#EDECE7; --sub:#9C998F; }
  }
  :root[data-theme="dark"]{ --bg:#191917; --card:#232320; --line:#37372F; --ink:#EDECE7; --sub:#9C998F; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  .wrap{max-width:480px; margin:0 auto; padding:28px 18px 60px;}
  h1{font-size:1.3rem; margin:0 0 20px;}

  .balance{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; text-align:center; margin-bottom:16px;}
  .balance .label{font-size:.75rem; color:var(--sub); margin-bottom:6px;}
  .balance .value{font-size:2rem; font-weight:700;}

  form{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  input{flex:1; min-width:100px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:.95rem;}
  select{padding:10px 8px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:.95rem;}
  button{padding:10px 16px; border:none; border-radius:8px; background:var(--ink); color:var(--bg); font-weight:600; font-size:.9rem; cursor:pointer;}

  ul{list-style:none; padding:0; margin:0;}
  li{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 4px; border-bottom:1px solid var(--line);}
  .amt.expense{color:var(--red);} .amt.income{color:var(--green);}
  li button{background:none; color:var(--sub); font-weight:400; padding:4px 6px; font-size:1rem;}
  .empty{text-align:center; color:var(--sub); padding:30px 0; font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pencatat Pengeluaran</h1>

  <div class="balance">
    <div class="label">Saldo</div>
    <div class="value" id="balance">Rp 0</div>
  </div>

  <form id="form">
    <input id="desc" type="text" placeholder="Keterangan" required>
    <input id="amount" type="number" min="0" placeholder="Jumlah" required>
    <select id="type">
      <option value="expense">Keluar</option>
      <option value="income">Masuk</option>
    </select>
    <button type="submit">Tambah</button>
  </form>

  <ul id="list"></ul>
</div>

<script>
  const KEY = 'expense-tracker-simple';
  let items = JSON.parse(localStorage.getItem(KEY) || '[]');

  const idr = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
  const save = () => localStorage.setItem(KEY, JSON.stringify(items));

  function render(){
    const total = items.reduce((a,b)=> a + (b.type==='income'? b.amount : -b.amount), 0);
    document.getElementById('balance').textContent = idr(total);

    const list = document.getElementById('list');
    list.innerHTML = items.length === 0
      ? '<div class="empty">Belum ada transaksi</div>'
      : items.slice().reverse().map(i => `
        <li>
          <span>${i.desc}</span>
          <span class="amt ${i.type}">${i.type==='expense'?'-':'+'}${idr(i.amount)}</span>
          <button data-id="${i.id}">✕</button>
        </li>
      `).join('');
  }

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const desc = document.getElementById('desc').value.trim();
    const amount = parseFloat(document.getElementById('amount').value);
    const type = document.getElementById('type').value;
    if(!desc || !amount || amount <= 0) return;
    items.push({ id: Date.now(), desc, amount, type });
    save(); render();
    e.target.reset();
  });

  document.getElementById('list').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if(!btn) return;
    items = items.filter(i => i.id !== Number(btn.dataset.id));
    save(); render();
  });

  render();
</script>
</body>
</html>
